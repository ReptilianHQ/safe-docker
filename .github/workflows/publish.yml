name: Publish Docker image (baseline)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: reptilianhq/safe-docker
  VARIANT: baseline

concurrency:
  group: publish-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race ./...

  build-amd64:
    name: Build amd64 image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      branch_tag: ${{ steps.meta.outputs.branch_tag }}
      latest_tag: ${{ steps.meta.outputs.latest_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA_TAG="sha-$(printf %s "$GITHUB_SHA" | cut -c1-7)-${{ env.VARIANT }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_TAG="pr-${{ github.event.pull_request.number }}-${{ env.VARIANT }}"
            LATEST_TAG=""
          else
            BRANCH_TAG="main-${{ env.VARIANT }}"
            LATEST_TAG="latest-${{ env.VARIANT }}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}-amd64
          cache-from: type=gha,scope=publish-baseline-amd64
          cache-to: type=gha,mode=max,scope=publish-baseline-amd64

  build-arm64:
    name: Build arm64 image
    needs: [lint, test]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      branch_tag: ${{ steps.meta.outputs.branch_tag }}
      latest_tag: ${{ steps.meta.outputs.latest_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA_TAG="sha-$(printf %s "$GITHUB_SHA" | cut -c1-7)-${{ env.VARIANT }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_TAG="pr-${{ github.event.pull_request.number }}-${{ env.VARIANT }}"
            LATEST_TAG=""
          else
            BRANCH_TAG="main-${{ env.VARIANT }}"
            LATEST_TAG="latest-${{ env.VARIANT }}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}-arm64
          cache-from: type=gha,scope=publish-baseline-arm64
          cache-to: type=gha,mode=max,scope=publish-baseline-arm64

  publish-manifest:
    name: Publish multi-arch manifest
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest tags
        run: |
          IMAGE="${{ needs.build-amd64.outputs.image }}"
          SHA_TAG="${{ needs.build-amd64.outputs.sha_tag }}"
          BRANCH_TAG="${{ needs.build-amd64.outputs.branch_tag }}"
          LATEST_TAG="${{ needs.build-amd64.outputs.latest_tag }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker buildx imagetools create \
              -t ${IMAGE}:${SHA_TAG} \
              -t ${IMAGE}:${BRANCH_TAG} \
              ${IMAGE}:${SHA_TAG}-amd64 \
              ${IMAGE}:${SHA_TAG}-arm64
          else
            CANONICAL_SHA_TAG="sha-$(printf %s "$GITHUB_SHA" | cut -c1-7)"
            CANONICAL_BRANCH_TAG="main"
            CANONICAL_LATEST_TAG="latest"

            docker buildx imagetools create \
              -t ${IMAGE}:${SHA_TAG} \
              -t ${IMAGE}:${BRANCH_TAG} \
              -t ${IMAGE}:${LATEST_TAG} \
              -t ${IMAGE}:${CANONICAL_SHA_TAG} \
              -t ${IMAGE}:${CANONICAL_BRANCH_TAG} \
              -t ${IMAGE}:${CANONICAL_LATEST_TAG} \
              ${IMAGE}:${SHA_TAG}-amd64 \
              ${IMAGE}:${SHA_TAG}-arm64
          fi
